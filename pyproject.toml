[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ipseclens-ai"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
 "sqlalchemy>=2.0,<3", "python-multipart>=0.0.20",
 "weasyprint==69.0", "numpy>=2.2,<3", "pandas>=2.2,<4", "scikit-learn>=1.6,<2"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11", "mypy>=1.15"]
[tool.setuptools.packages.find]
include = ["backend*", "training*"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
